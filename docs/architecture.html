<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>NPP AI Agent — Architecture</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans KR", sans-serif;
    background: #f4f6f8; color: #263238;
    padding: 24px;
  }
  h1 { font-size: 22px; color: #1a237e; margin-bottom: 6px; }
  .sub { color: #546e7a; margin-bottom: 20px; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .tab {
    padding: 8px 16px; background: #fff; border: 1px solid #cfd8dc;
    border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  .tab.active { background: #1a237e; color: #fff; border-color: #1a237e; }
  .frame {
    background: #fff; border: 1px solid #cfd8dc; border-radius: 8px;
    padding: 14px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);
  }
  .frame.hidden { display: none; }
  img { width: 100%; height: auto; display: block; }
  .hint {
    margin-top: 16px; padding: 10px 14px; background: #fff3e0;
    border-left: 4px solid #ef6c00; border-radius: 4px; font-size: 13px;
  }
  .hint strong { color: #bf360c; }
  a { color: #1565c0; }
</style>
</head>
<body>
  <h1>🏭 NPP AI Agent — 시스템 구조 다이어그램</h1>
  <p class="sub">
    Westinghouse PWR 운영절차서 (GOP / EOP / AOP) 기반 실시간 운전 지원 AI Agent
    — 두 가지 보기 제공
  </p>
  <div class="tabs">
    <button class="tab active" onclick="show('arch')">① 시스템 구조 (계층도)</button>
    <button class="tab" onclick="show('flow')">② 운전원 1회 요청 흐름</button>
  </div>
  <div id="arch" class="frame">
    <img src="architecture.svg" alt="시스템 구조도">
  </div>
  <div id="flow" class="frame hidden">
    <img src="flow.svg" alt="요청 처리 시퀀스">
  </div>

  <div class="hint">
    <strong>📷 PNG로 저장하려면:</strong> 위 이미지 위에서 우클릭 → 「이미지로 저장…」<br>
    <strong>🖨 PDF로 저장하려면:</strong> 브라우저 인쇄(Ctrl+P) → 「PDF로 저장」 선택<br>
    <strong>📂 원본 SVG 파일:</strong>
    <a href="architecture.svg">architecture.svg</a> ·
    <a href="flow.svg">flow.svg</a>
    (모든 브라우저에서 직접 열림. 벡터 형식이므로 확대해도 깨지지 않음.)
  </div>

<script>
  function show(id) {
    document.querySelectorAll('.frame').forEach(f => f.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    document.querySelectorAll('.tab').forEach((t,i) => {
      t.classList.toggle('active',
        (i === 0 && id === 'arch') || (i === 1 && id === 'flow'));
    });
  }
</script>
</body>
</html>
