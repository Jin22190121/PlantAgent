    <text x="1200" y="22" font-size="11" font-weight="700" fill="#004d40" text-anchor="middle">8. 응답</text>
    <text x="1200" y="40" font-size="9" fill="#546e7a" text-anchor="middle">respond</text>
    <text x="1200" y="54" font-size="9" fill="#90a4ae" text-anchor="middle">UI로 전송</text>
