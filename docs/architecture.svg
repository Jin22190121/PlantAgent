    <text x="380" y="40" font-size="9" fill="#546e7a" text-anchor="middle">plan_action</text>
    <text x="380" y="54" font-size="9" fill="#90a4ae" text-anchor="middle">LLM 호출</text>

    <path d="M440,30 L480,30" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

