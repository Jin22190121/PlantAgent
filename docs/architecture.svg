<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1080" font-family="-apple-system, 'Segoe UI', 'Noto Sans KR', Arial, sans-serif">
  <!--
    NPP AI Agent — System Architecture (beginner-friendly)
    Layers (top → bottom): User → UI → API → AI orchestration → Safety/Tools → Core Services → Data
  -->
  <defs>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="1" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Arrow head -->
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L10,6 z" fill="#37474f"/>
    </marker>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,12 L10,6 z" fill="#ef6c00"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1500" height="1080" fill="#fafbfc"/>

  <!-- TITLE -->
  <text x="750" y="40" font-size="26" font-weight="700" fill="#1a237e" text-anchor="middle">
    🏭 NPP AI Agent — 시스템 구조
  </text>
  <text x="750" y="68" font-size="14" fill="#546e7a" text-anchor="middle">
    Westinghouse PWR 운영절차서 (GOP / EOP / AOP) 기반 실시간 운전 지원 시스템
  </text>

  <!-- ═══ LAYER 1: USER ═══ -->
  <rect x="40" y="100" width="1420" height="100" rx="10" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="125" font-size="13" font-weight="700" fill="#e65100">① 사용자 (User Layer)</text>

  <g transform="translate(140,130)">
    <circle cx="0" cy="30" r="28" fill="#ffb74d" stroke="#ef6c00" stroke-width="2"/>
    <text x="0" y="38" font-size="22" text-anchor="middle">👤</text>
    <text x="0" y="80" font-size="13" font-weight="600" fill="#bf360c" text-anchor="middle">운전원 (Operator)</text>
  </g>

  <g transform="translate(280,118)">
    <rect width="280" height="80" rx="8" fill="#fff" stroke="#ef6c00" stroke-width="2"/>
    <text x="140" y="25" font-size="14" font-weight="700" fill="#bf360c" text-anchor="middle">🖥  웹 브라우저</text>
    <text x="140" y="46" font-size="11" fill="#546e7a" text-anchor="middle">• 시나리오 선택 (GOP/EOP/AOP)</text>
    <text x="140" y="62" font-size="11" fill="#546e7a" text-anchor="middle">• AI 채팅 + 승인 모달 + 절차 트래커</text>
  </g>

  <!-- Arrow user → server -->
  <path d="M 420,200 L 420,235" stroke="#ef6c00" stroke-width="2.5" marker-end="url(#arrowOrange)"/>
  <text x="430" y="222" font-size="11" fill="#bf360c">HTTP / SSE</text>

  <!-- Right-side legend: file -->
  <g transform="translate(900,118)">
    <rect width="540" height="80" rx="8" fill="#fff" stroke="#90a4ae" stroke-width="1"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#37474f">📂 관련 파일</text>
    <text x="20" y="42" font-size="11" fill="#546e7a" font-family="Consolas, monospace">
      static/index.html  ←  3-pane UI (좌:상태+추세  중:채팅  우:절차 트래커)
    </text>
    <text x="20" y="60" font-size="11" fill="#546e7a" font-family="Consolas, monospace">
      static/demo.html   ←  자동 재생 시연 영상 (50초)
    </text>
  </g>

  <!-- ═══ LAYER 2: WEB SERVER ═══ -->
  <rect x="40" y="240" width="1420" height="100" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="265" font-size="13" font-weight="700" fill="#0d47a1">② 웹 서버 (FastAPI)</text>

  <g transform="translate(140,275)">
    <rect width="700" height="55" rx="6" fill="#fff" stroke="#1565c0"/>
    <text x="350" y="22" font-size="14" font-weight="700" fill="#0d47a1" text-anchor="middle">⚡ web_server.py — REST + Server-Sent Events</text>
    <text x="350" y="44" font-size="11" fill="#546e7a" text-anchor="middle">
      GET /plant/stream  •  POST /chat/stream  •  POST /chat/approve  •  POST /sim/action  •  GET /health
    </text>
  </g>

  <g transform="translate(870,275)">
    <rect width="570" height="55" rx="6" fill="#fff" stroke="#90a4ae"/>
    <text x="20" y="22" font-size="12" font-weight="700" fill="#37474f">하는 일</text>
    <text x="20" y="42" font-size="11" fill="#546e7a">
      운전원 ↔ AI 채팅 중계, 시뮬레이터 상태 1Hz 푸시, 운전원 직접 조작 라우팅, HITL 승인 흐름
    </text>
  </g>

  <!-- Arrow server → graph -->
  <path d="M 750,340 L 750,375" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="760" y="362" font-size="11" fill="#37474f">운전원 발화 + 세션 ID</text>

  <!-- ═══ LAYER 3: AI ORCHESTRATION (LangGraph) ═══ -->
  <rect x="40" y="380" width="1420" height="230" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="2" filter="url(#shadow)"/>
  <text x="60" y="405" font-size="13" font-weight="700" fill="#006064">③ AI 오케스트레이션 (LangGraph 상태머신, 8 노드)</text>

  <!-- 8 nodes horizontal flow -->
  <g transform="translate(70,425)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="120" height="60" rx="6" fill="#fff" stroke="#00838f"/>
    <text x="60" y="22" font-size="11" font-weight="700" fill="#004d40" text-anchor="middle">1. 상태 파악</text>
    <text x="60" y="40" font-size="9" fill="#546e7a" text-anchor="middle">assess_state</text>
    <text x="60" y="54" font-size="9" fill="#90a4ae" text-anchor="middle">시뮬레이터 조회</text>

