    <text x="550" y="60" font-size="9" font-weight="700" fill="#e65100" text-anchor="middle">★ Human-in-the-Loop</text>

    <path d="M620,30 L660,30" stroke="#37474f" stroke-width="1.5" marker-end="url(#arrow)"/>

    <!-- Node 5 -->
