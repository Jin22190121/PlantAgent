    <text x="550" y="14" font-size="11" font-weight="700" fill="#e65100" text-anchor="middle">⚠ 4. 승인 게이트</text>
    <text x="550" y="30" font-size="9" fill="#bf360c" text-anchor="middle">approval_gate</text>
