<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPP AI Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    height: 100dvh;
    font-family: 'Segoe UI', sans-serif;
    background: #0a0f1e;
    color: #e0e0e0;
    overflow: hidden;
  }

  .wrapper {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  /* 헤더 */
  .header {
    background: rgba(0,0,0,0.5);
    border-bottom: 1px solid #1e3a5f;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-icon {
    width: 30px; height: 30px; border-radius: 50%;
    background: radial-gradient(circle, #00ff88, #005533);
    display: flex; align-items: center;
    justify-content: center; font-size: 16px;
  }
  .header-title { font-size: 14px; font-weight: 700; color: #00ff88; }
  .header-sub   { font-size: 11px; color: #666; margin-top: 2px; }

  /* 플랜트 상태 바 */
  .plant-bar {
    background: rgba(0,20,40,0.8);
    border-bottom: 1px solid #1e3a5f;
    padding: 6px 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }
  .plant-item { display: flex; align-items: center; gap: 4px; }
  .plant-label { font-size: 9px; color: #666; text-transform: uppercase; }
  .plant-value { font-size: 12px; font-family: monospace; font-weight: 700; }
  .plant-value.normal { color: #00ff88; }
  .plant-value.alarm  { color: #ff4444; }

  /* 메인 영역 */
  .main {
    display: flex;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  /* 도구 패널 */
  .tool-panel {
    width: 240px;
    border-right: 1px solid #1e3a5f;
    background: rgba(0,10,20,0.6);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .tool-panel-title {
    padding: 10px 14px;
    font-size: 11px; color: #00ff8888;
    letter-spacing: 1px;
    border-bottom: 1px solid #1e3a5f;
    flex-shrink: 0;
  }
  .tool-log {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-height: 0;
  }
  .tool-item {
    background: rgba(0,100,200,0.1);
    border: 1px solid #1e3a5f;
    border-radius: 6px;
    padding: 8px 10px;
    animation: fadeIn 0.3s ease;
  }
  .tool-item.done {
    border-color: #00ff8833;
    background: rgba(0,255,136,0.05);
  }
  .tool-name   { font-size: 11px; font-family: monospace; color: #66aaff; font-weight: 700; }
  .tool-result { font-size: 10px; color: #888; margin-top: 3px; line-height: 1.4; }

  /* 채팅 영역 */
  .chat-area {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    min-height: 0;
  }

  /* 메시지 버블 */
  .msg { display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
  .msg.user { flex-direction: row-reverse; }

  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center;
    justify-content: center; font-size: 14px;
    flex-shrink: 0; margin-top: 2px;
  }
  .msg.ai .msg-avatar {
    background: radial-gradient(circle, #00ff88, #005533);
  }
  .msg.user .msg-avatar {
    background: radial-gradient(circle, #4488ff, #002266);
  }
  .msg.system .msg-avatar { background: rgba(255,255,255,0.1); }

  .msg-bubble {
    max-width: 75%;
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user .msg-bubble {
    background: rgba(0,100,255,0.15);
    border: 1px solid #0044aa33;
    border-radius: 12px 4px 12px 12px;
    color: #cce0ff;
  }
  .msg.ai .msg-bubble {
    background: rgba(0,255,136,0.05);
    border: 1px solid #00ff8822;
    border-radius: 4px 12px 12px 12px;
  }
  .msg.system .msg-bubble {
    background: rgba(255,255,255,0.03);
    border: 1px solid #ffffff11;
    border-radius: 8px;
    color: #888; font-size: 12px;
  }

  /* 타이핑 인디케이터 */
  .typing { display: flex; gap: 4px; padding: 4px 0; }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: #00ff88;
    animation: blink 1s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  /* 상태 메시지 */
  .status-msg {
    font-size: 12px; color: #00ff8888;
    padding: 4px 8px;
    border-left: 2px solid #00ff8833;
    margin: 4px 0;
  }

  /* 빠른 질문 버튼 */
  .quick-btns {
    padding: 6px 12px;
    display: flex;
    gap: 6px;
    flex-wrap: nowrap;
    overflow-x: auto;
    flex-shrink: 0;
    border-top: 1px solid #1e3a5f;
    scrollbar-width: none;
  }
  .quick-btns::-webkit-scrollbar { display: none; }
  .quick-btn {
    padding: 5px 12px;
    border-radius: 12px;
    border: 1px solid #1e3a5f;
    background: rgba(0,50,100,0.3);
    color: #88aacc;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .quick-btn:hover { border-color: #00ff8844; color: #00ff88; }

  /* 입력 영역 */
  .input-area {
    border-top: 1px solid #1e3a5f;
    padding: 6px 10px;
    display: flex;
    gap: 10px;
    align-items: flex-end;
    background: rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  textarea {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid #1e3a5f;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 13px;
    padding: 8px 12px;
    resize: none;
    min-height: 38px;
    max-height: 80px;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  textarea:focus { border-color: #00ff8844; }

  .send-btn {
    width: 38px; height: 38px;
    border-radius: 10px;
    border: 1px solid #00ff8844;
    background: rgba(0,255,136,0.1);
    color: #00ff88;
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s;
    flex-shrink: 0;
  }
  .send-btn:hover   { background: rgba(0,255,136,0.2); }
  .send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .reset-btn {
    padding: 0 10px; height: 38px;
    border-radius: 10px;
    border: 1px solid #ff444422;
    background: rgba(255,68,68,0.08);
    color: #ff6666; font-size: 12px;
    cursor: pointer; flex-shrink: 0;
    transition: all 0.2s;
  }
  .reset-btn:hover { background: rgba(255,68,68,0.15); }

  /* 애니메이션 */
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.2; }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e3a5f; border-radius: 2px; }
</style>
</head>
<body>
<div class="wrapper">

  <!-- 헤더 -->
  <div class="header">
    <div class="header-left">
      <div class="header-icon">⚛</div>
      <div>
        <div class="header-title">NPP AI AGENT</div>
        <div class="header-sub">원자력발전소 교육훈련 보조 시스템</div>
      </div>
    </div>
    <div style="font-size:11px; color:#444;">Gemini 2.5 Flash · MCP 3서버</div>
  </div>

  <!-- 플랜트 상태 바 -->
  <div class="plant-bar">
    <div class="plant-item">
      <span class="plant-label">RCS 압력</span>
      <span class="plant-value" id="pv-rcs">-- psia</span>
    </div>
    <div class="plant-item">
      <span class="plant-label">원자로 출력</span>
      <span class="plant-value" id="pv-power">-- %</span>
    </div>
    <div class="plant-item">
      <span class="plant-label">SI 신호</span>
      <span class="plant-value" id="pv-si">--</span>
    </div>
    <div class="plant-item">
      <span class="plant-label">ECCS</span>
      <span class="plant-value" id="pv-eccs">--</span>
    </div>
    <div class="plant-item">
      <span class="plant-label">소외전원</span>
      <span class="plant-value" id="pv-power2">--</span>
    </div>
  </div>

  <!-- 메인 -->
  <div class="main">

    <!-- 도구 로그 패널 -->
    <div class="tool-panel">
      <div class="tool-panel-title">🔧 MCP 도구 호출 로그</div>
      <div class="tool-log" id="toolLog">
        <div style="color:#333; font-size:11px;
                    text-align:center; margin-top:20px;">
          대화를 시작하면<br>도구 호출이 표시됩니다
        </div>
      </div>
    </div>

    <!-- 채팅 -->
    <div class="chat-area">
      <div class="messages" id="messages">
        <div class="msg system">
          <div class="msg-avatar">⚙</div>
          <div class="msg-bubble">NPP AI Agent에 연결되었습니다.
훈련 시나리오: LOCA (냉각재 상실 사고)

현재 상황을 질문하거나 아래 빠른 질문을 사용해보세요.</div>
        </div>
      </div>

      <!-- 빠른 질문 버튼 -->
      <div class="quick-btns">
        <button class="quick-btn"
          onclick="quickSend('현재 플랜트 상태를 확인해주세요.')">
          📡 플랜트 상태 확인
        </button>
        <button class="quick-btn"
          onclick="quickSend('현재 상황에서 즉시 취해야 할 조치를 알려주세요.')">
          🚨 즉시 조치사항
        </button>
        <button class="quick-btn"
          onclick="quickSend('ECCS 작동 여부를 어떻게 확인하나요?')">
          🔍 ECCS 확인 방법
        </button>
        <button class="quick-btn"
          onclick="quickSend('격납건물 격리 절차를 알려주세요.')">
          🛡 격납건물 격리
        </button>
        <button class="quick-btn"
          onclick="quickSend('지금 상황에서 힌트를 주세요.')">
          💡 힌트 요청
        </button>
      </div>

      <!-- 입력 영역 -->
      <div class="input-area">
        <textarea
          id="input"
          placeholder="질문을 입력하세요... (Enter 전송 / Shift+Enter 줄바꿈)"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="reset-btn" onclick="resetSession()">↺ 초기화</button>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">↑</button>
      </div>
    </div>
  </div>
</div>

<script>
const SESSION_ID = 'session-' + Date.now();
let isLoading = false;

// ── 플랜트 상태 로드 ──────────────────────────
async function loadPlantStatus() {
  try {
    const res  = await fetch('/plant/status');
    const data = await res.json();
    const rcs     = data.rcs     || {};
    const safety  = data.safety  || {};
    const elec    = data.electrical || {};
    const reactor = data.reactor || {};

    setVal('pv-rcs',    `${rcs.pressure_psia} psia`,
      rcs.pressure_psia < 1700);
    setVal('pv-power',  `${reactor.power_percent} %`,
      reactor.power_percent < 10);
    setVal('pv-si',     safety.si_signal ? 'ON ⚠' : 'OFF',
      safety.si_signal);
    setVal('pv-eccs',   safety.eccs_status,
      safety.eccs_status === 'RUNNING');
    setVal('pv-power2', elec.offsite_power ? '정상' : '상실 ⚠',
      !elec.offsite_power);
  } catch(e) {}
}

function setVal(id, text, isAlarm) {
  const el = document.getElementById(id);
  if (!el) return;
  el.textContent = text;
  el.className = 'plant-value ' + (isAlarm ? 'alarm' : 'normal');
}

// ── 메시지 추가 ───────────────────────────────
function addMessage(role, text) {
  const c   = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const icon = role === 'user' ? '👤' : role === 'ai' ? '⚛' : '⚙';
  div.innerHTML = `
    <div class="msg-avatar">${icon}</div>
    <div class="msg-bubble">${escapeHtml(text)}</div>`;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}

function addStatusMsg(text) {
  const c   = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'status-msg';
  div.id = 'cur-status';
  div.textContent = text;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}
function updateStatusMsg(text) {
  const el = document.getElementById('cur-status');
  if (el) el.textContent = text;
}
function removeStatusMsg() {
  const el = document.getElementById('cur-status');
  if (el) el.remove();
}

function showTyping() {
  const c   = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg ai';
  div.id = 'typing';
  div.innerHTML = `
    <div class="msg-avatar">⚛</div>
    <div class="msg-bubble">
      <div class="typing">
        <span></span><span></span><span></span>
      </div>
    </div>`;
  c.appendChild(div);
  c.scrollTop = c.scrollHeight;
}
function removeTyping() {
  const el = document.getElementById('typing');
  if (el) el.remove();
}

// ── 도구 로그 ─────────────────────────────────
function addToolLog(toolName) {
  const log = document.getElementById('toolLog');
  const old = log.querySelector('div[style]');
  if (old) old.remove();

  const id  = 'tl-' + toolName + '-' + Date.now();
  const div = document.createElement('div');
  div.className = 'tool-item';
  div.id = id;
  div.innerHTML = `
    <div class="tool-name">🔧 ${toolName}</div>
    <div class="tool-result">⏳ 실행 중...</div>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return id;
}
function updateToolLog(id, result) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.add('done');
  el.querySelector('.tool-result').textContent = '✅ ' + result;
}

// ── 메시지 전송 ───────────────────────────────
async function sendMessage() {
  const input = document.getElementById('input');
  const text  = input.value.trim();
  if (!text || isLoading) return;

  isLoading = true;
  input.value = '';
  autoResize(input);
  document.getElementById('sendBtn').disabled = true;

  addMessage('user', text);
  showTyping();
  addStatusMsg('🤖 AI 분석 시작...');

  const toolLogIds = {};

  try {
    const res = await fetch('/chat/stream', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        session_id: SESSION_ID,
        message: text
      })
    });

    const reader  = res.body.getReader();
    const decoder = new TextDecoder();
    let   buffer  = '';

    while (true) {
      const {done, value} = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, {stream: true});
      const lines = buffer.split('\n\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.startsWith('data: ')) continue;
        try {
          const data = JSON.parse(line.slice(6));

          if (data.type === 'status') {
            updateStatusMsg(data.text);

          } else if (data.type === 'tool_start') {
            removeTyping();
            toolLogIds[data.tool] = addToolLog(data.tool);
            updateStatusMsg(`🔧 ${data.tool} 실행 중...`);

          } else if (data.type === 'tool_done') {
            if (toolLogIds[data.tool])
              updateToolLog(toolLogIds[data.tool], data.summary);
            updateStatusMsg(`✅ ${data.tool} 완료`);

          } else if (data.type === 'answer') {
            removeTyping();
            removeStatusMsg();
            addMessage('ai', data.text);

          } else if (data.type === 'error') {
            removeTyping();
            removeStatusMsg();
            addMessage('system', '⚠️ ' + data.text);
          }
        } catch(e) {}
      }
    }
  } catch(e) {
    removeTyping();
    removeStatusMsg();
    addMessage('system', '오류: ' + e.message);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  document.getElementById('input').focus();
  loadPlantStatus();
}

// ── 세션 초기화 ───────────────────────────────
async function resetSession() {
  await fetch(`/chat/${SESSION_ID}`, {method: 'DELETE'});
  document.getElementById('messages').innerHTML = `
    <div class="msg system">
      <div class="msg-avatar">⚙</div>
      <div class="msg-bubble">대화가 초기화되었습니다.</div>
    </div>`;
  document.getElementById('toolLog').innerHTML = `
    <div style="color:#333;font-size:11px;
                text-align:center;margin-top:20px;">
      대화를 시작하면<br>도구 호출이 표시됩니다
    </div>`;
}

function quickSend(text) {
  document.getElementById('input').value = text;
  sendMessage();
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/\n/g, '<br>');
}

loadPlantStatus();
</script>
</body>
</html>
